# One service per app of the repository (apps/*), built from its root so
# each one sees the shared packages (packages/*).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: visualtracert-canvas:latest
    container_name: visualtracert-canvas
    restart: unless-stopped
    # this host only: there are no accounts, and through the web the emulator
    # is root on this machine. To reach it from elsewhere, put it behind a
    # proxy that asks who you are (or an SSH tunnel)
    ports:
      - "127.0.0.1:9160:80"

  # Emulation: creates the devices' containers and the veth cables between
  # them. It needs Docker's socket and to enter other containers' network
  # namespaces (privileged, host PIDs): that is root on this machine, so it is
  # only reachable through the web's nginx (/api) and, for development, from
  # this host on 127.0.0.1:9161.
  emulator:
    build:
      context: .
      dockerfile: apps/emulator/Dockerfile
    image: visualtracert-canvas-emulator:latest
    container_name: visualtracert-canvas-emulator
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      # images that need a privileged container (Nokia SR Linux) run only
      # with ALLOW_PRIVILEGED=1: such a container, and its CLI, is root on
      # this host. Off unless started as ALLOW_PRIVILEGED=1 docker compose up -d
      ALLOW_PRIVILEGED: "${ALLOW_PRIVILEGED:-0}"
      DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # the image profiles (profiles.json): they outlive the container
      - emulator-data:/data
    ports:
      - "127.0.0.1:9161:8080"

volumes:
  emulator-data:
