# Production: the three services from their images (built by GitHub Actions
# and published to GHCR), behind Caddy, which serves HTTPS (Let's Encrypt)
# when DOMAIN is a domain pointing here, or plain HTTP on port 80 while it is
# not set. Only Caddy is published; the web, the accounts and the emulator
# stay on the internal network. Settings in .env (see .env.example).
#   docker compose pull && docker compose up -d
name: visual-tracert

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE: "${DOMAIN:-:80}"
      WWW_SITE: "www.${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

  web:
    image: ghcr.io/${GHCR_OWNER:-eirikrrrr}/visual-tracert-web:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api, emulator]

  api:
    image: ghcr.io/${GHCR_OWNER:-eirikrrrr}/visual-tracert-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      # behind Caddy with HTTPS the cookies are Secure by themselves (X-Forwarded-Proto)
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      SETUP_CODE: "${SETUP_CODE:-}"
      MAX_SAVED_LABS: "${MAX_SAVED_LABS:-50}"
      # signing in with GitHub and Google (each on when its id and secret are set)
      PUBLIC_URL: "${PUBLIC_URL:-}"
      OAUTH_GITHUB_ID: "${OAUTH_GITHUB_ID:-}"
      OAUTH_GITHUB_SECRET: "${OAUTH_GITHUB_SECRET:-}"
      OAUTH_GOOGLE_ID: "${OAUTH_GOOGLE_ID:-}"
      OAUTH_GOOGLE_SECRET: "${OAUTH_GOOGLE_SECRET:-}"
    volumes:
      - api-data:/data
      - ./backups:/backups

  # root on this machine (Docker's socket, privileged, host PIDs): never published
  emulator:
    image: ghcr.io/${GHCR_OWNER:-eirikrrrr}/visual-tracert-emulator:${TAG:-latest}
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      ALLOW_PRIVILEGED: "${ALLOW_PRIVILEGED:-0}"
      MAX_LABS_PER_USER: "${MAX_LABS_PER_USER:-3}"
      MAX_CONTAINERS_PER_USER: "${MAX_CONTAINERS_PER_USER:-24}"
      DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - emulator-data:/data

volumes:
  api-data:
  emulator-data:
  caddy-data:
  caddy-config:
