# a WebSocket (a device's CLI) keeps its upgrade; other requests close as usual
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # hashed bundles never change: cache them for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    resolver 127.0.0.11 valid=10s;

    # the emulator's API, its CLI and captures (no accounts: this is a local
    # tool, so the web listens on this host only); resolved when asked, so
    # the web starts without it
    location /api/ {
        set $emulator http://emulator:8080;
        proxy_pass $emulator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # an idle CLI stays open for an hour
        proxy_read_timeout 3600s;
        client_max_body_size 2m;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
