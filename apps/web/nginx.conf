# a WebSocket (a device's CLI) keeps its upgrade; other requests close as usual
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# behind another proxy with HTTPS (Cloudflare…), what it says; else this request's
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # hashed bundles never change: cache them for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    resolver 127.0.0.11 valid=10s;

    # accounts and sessions (apps/api)
    location /auth/ {
        set $accounts http://api:8090;
        proxy_pass $accounts;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }
    # what is sent bigger: an admin's machine (two labs), an account's labs and
    # settings (phase B), and the machines' files
    location ~ ^/auth/(machines|labs)/|^/auth/me/settings$ {
        set $accounts http://api:8090;
        proxy_pass $accounts;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 600k;
    }
    location = /auth/files {
        set $accounts http://api:8090;
        proxy_pass $accounts;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 11m;
    }

    # asked before every emulator request, its CLI and captures too: without a
    # session, 401; not allowed (another site, an admin's action), 403
    location = /_auth {
        internal;
        set $accounts http://api:8090;
        proxy_pass $accounts/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }
    location @forbidden {
        default_type application/json;
        return 403 '{"error":"forbidden"}';
    }

    # the emulator's API, for a signed-in user (who goes to it in X-User-*);
    # resolved when asked, so the web starts without it
    location /api/ {
        auth_request /_auth;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_name $upstream_http_x_user_name;
        auth_request_set $user_role $upstream_http_x_user_role;
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Name $user_name;
        proxy_set_header X-User-Role $user_role;
        set $emulator http://emulator:8080;
        proxy_pass $emulator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # an idle CLI stays open for an hour
        proxy_read_timeout 3600s;
        client_max_body_size 2m;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
