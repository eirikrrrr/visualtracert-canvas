# Every push to main: the tests, then the three images (web, api, emulator)
# built for the server (linux/amd64) and published to GHCR, then the server
# takes them (deploy/docker-compose.yml) and restarts what changed.
#
# The server needs, once: deploy/setup-server.sh, and /opt/visual-tracert/.env.
# In the repository (Settings → Secrets and variables → Actions):
#   variable DEPLOY_HOST    the server's address (its IP); without it, nothing is deployed
#   secret DEPLOY_SSH_KEY   a private key whose public half is in the server's root authorized_keys
# The images are private while the repository is: the server logs in to GHCR
# with this run's token to pull them.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [web, api, emulator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/visual-tracert-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/visual-tracert-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Copy the deploy files and restart
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh root@"$HOST":/opt/visual-tracert/
          echo "$TOKEN" | ssh -i ~/.ssh/deploy -o BatchMode=yes root@"$HOST" "cd /opt/visual-tracert \
            && docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null \
            && docker compose pull --quiet && docker compose up -d --remove-orphans \
            && docker logout ghcr.io >/dev/null && docker image prune -f >/dev/null"
      - name: Check it answers
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          # through the web's nginx, from the server itself (with or without a domain)
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy -o BatchMode=yes root@"$HOST" "cd /opt/visual-tracert && docker compose exec -T web wget -q -O /dev/null http://127.0.0.1/auth/health"; then echo "up"; exit 0; fi
            sleep 5
          done
          echo "the server does not answer /auth/health"; exit 1
